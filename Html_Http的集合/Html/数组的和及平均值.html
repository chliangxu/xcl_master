<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    var arr = [1,2,3,4,8,9,5,8];
    var num = 0;
    var catgory = 0;
    for (var i = 0; i < arr.length; i++){
        num += arr[i];

    }

    catgory = num / arr.length;

    console.log('和为:', num, "平均值为：", catgory)
</script>
</head>
<body>
    <h1>数组的和及平均值</h1>
</body>
</html>
