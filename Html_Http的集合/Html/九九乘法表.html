<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var str = '';
        for (i = 1; i <= 9; i++){ // 外层循环控制行数
            for (j = 1; j <= i; j++){ // 里层循环控制每一行的个数
            // 1 X 2 = 2
            str += j + 'x' + i + '=' + i * j + '\t';
            }
            str += "\n";
        }
        console.log(str)
    </script>
</head>
<body>
    <h1>This is a Heading</h1>
<body>
</html>
