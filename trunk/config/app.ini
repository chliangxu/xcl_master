[App]
name = CJGameStudio
version = 1.0.0
title = CJGameStudio - 游戏开发工具集成平台
subtitle = 游戏开发工具集成平台

[User]
lastuser = 
autologin = false
lastcategory = project
username = admin
userrole = 客户端程序

[Features]
autosave = true
autoupdate = false
analytics = false
debugmode = false
showusagestats = true
enablefavorites = true

[Paths]
datadir = data
logsdir = logs
configdir = config
cachedir = cache
toolsdir = tools
assetsdir = assets

[Logging]
level = INFO
maxfilesize = 10485760
backupcount = 5
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s

[Favorites]
toolids = 

